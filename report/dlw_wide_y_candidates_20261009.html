<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DLW 宽 y 范围绘图候选</title><style>body{max-width:1200px;margin:36px auto;padding:0 24px;font:18px/1.75 "Times New Roman",SimSun,serif;color:#222;background:#fff}h1{font-size:28px}h2{font-size:23px;margin-top:40px}img{max-width:100%;height:auto}figure{margin:18px 0}figcaption{font-size:15px;color:#555}a{color:#265c7c}</style><h1>DLW Case C：扩大 y 范围后的三种画法</h1><p>固定 t=0.01，以实际 SD2＋RK4 动网格数值解展示 u、v 及绝对误差。展示范围 x,y∈[-30,30]，计算域 x∈[-40,40)、y∈[-30,30)，保持 Δx=0.15625、h=0.125、Δt=0.000125。三种画法使用同一份场数据和误差。</p><p>扩大 y 后，两条分支更容易分辨。为避免 x 截掉斜向分支，x 展示范围同时扩大。2HS 的第二坐标是时间 t，保留原来的 0 至 0.5 时间历史。</p><h2>A　盒式曲面</h2><figure><a href="../Workspaces/paired_field_preview_20261009/dlw_box.png"><img src="../Workspaces/paired_field_preview_20261009/dlw_box.png" alt="A　盒式曲面：物理场与绝对误差"></a><figcaption>左列数值物理场，右列绝对误差；上行 u，下行 v。<a href="../Workspaces/paired_field_preview_20261009/dlw_box.pdf">PDF</a> · <a href="../Workspaces/paired_field_preview_20261009/dlw_box.png">完整图片</a></figcaption></figure><h2>B　曲面与底面投影</h2><figure><a href="../Workspaces/paired_field_preview_20261009/dlw_floor.png"><img src="../Workspaces/paired_field_preview_20261009/dlw_floor.png" alt="B　曲面与底面投影：物理场与绝对误差"></a><figcaption>左列数值物理场，右列绝对误差；上行 u，下行 v。<a href="../Workspaces/paired_field_preview_20261009/dlw_floor.pdf">PDF</a> · <a href="../Workspaces/paired_field_preview_20261009/dlw_floor.png">完整图片</a></figcaption></figure><h2>C　二维热图</h2><figure><a href="../Workspaces/paired_field_preview_20261009/dlw_map.png"><img src="../Workspaces/paired_field_preview_20261009/dlw_map.png" alt="C　二维热图：物理场与绝对误差"></a><figcaption>左列数值物理场，右列绝对误差；上行 u，下行 v。<a href="../Workspaces/paired_field_preview_20261009/dlw_map.pdf">PDF</a> · <a href="../Workspaces/paired_field_preview_20261009/dlw_map.png">完整图片</a></figcaption></figure><p><a href="../Workspaces/paired_field_preview_20261009/candidates_wide_y.png">查看 DLW 与 2HS 六图总览</a></p><
